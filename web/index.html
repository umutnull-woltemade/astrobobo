              <p itemprop="text">Doğum haritası (natal chart), doğduğunuz anda gökyüzündeki gezegenlerin konumlarını gösteren kozmik bir haritadır. Güneş, Ay ve gezegenlerin hangi burçlarda ve evlerde olduğunu gösterir.</p>
            </dd>
          </div>
          <div itemscope itemprop="mainEntity" itemtype="https://schema.org/Question">
            <dt itemprop="name">Synastry (ilişki uyumu) analizi nasıl çalışır?</dt>
            <dd itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer">
              <p itemprop="text">Synastry, iki kişinin doğum haritalarını karşılaştırarak aralarındaki kozmik uyumu analiz eder. Gezegenlerin birbirleriyle yaptığı açılar ilişki dinamiklerini ortaya koyar.</p>
            </dd>
          </div>
          <div itemscope itemprop="mainEntity" itemtype="https://schema.org/Question">
            <dt itemprop="name">Yaşam yolu sayısı nasıl hesaplanır?</dt>
            <dd itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer">
              <p itemprop="text">Yaşam yolu sayınız, doğum tarihinizdeki tüm rakamların tek haneli bir sayıya (veya master sayılara) indirgenmesiyle bulunur. Örnek: 15.05.1990 = 1+5+0+5+1+9+9+0 = 30 = 3.</p>

  <div id="loading" class="loading" style="flex-direction: column; gap: 20px;">

    <span style="font-size: 14px; color: #888;">🌙 Yıldızlar hizalanıyor...</span>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // FIREBASE ANALYTICS STUB - Prevents white screen crash
    // firebase_core_web tries to call ff_trigger_firebase_analytics even without
    // firebase_analytics package. main.dart.js OVERWRITES normal assignments,
    // so we use Object.defineProperty with writable:false to prevent that.
    // ═══════════════════════════════════════════════════════════════════════════
    Object.defineProperty(window, 'ff_trigger_firebase_analytics', {
      value: function(callback) {
        console.debug('Firebase Analytics stub - blocked, callback not invoked');
        // DON'T call callback - this prevents Analytics code from trying to
        // initialize Firebase again, which would cause "duplicate-app" error
      },
      writable: false,
      configurable: false
    });

    // ═══════════════════════════════════════════════════════════════
    // LOADING SCREEN LOGIC — NEVER remove until app actually renders
    // OLD BUG: Removed on <flutter-view> detection → white screen
    // FIX: Only remove on flutter-first-frame (real content rendered)
    // ═══════════════════════════════════════════════════════════════
    var loadingRemoved = false;

    function removeLoadingScreen() {
      if (loadingRemoved) return;
      loadingRemoved = true;
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        loading.style.transition = 'opacity 0.5s ease-out';
        setTimeout(function() { loading.remove(); }, 500);
      }
      console.log('[VenusOne] Loading screen removed');
    }

    // ONLY remove loading on flutter-first-frame — this fires AFTER
    // the widget tree actually renders pixels, not just engine init
    window.addEventListener('flutter-first-frame', function() {
      console.log('[VenusOne] First frame rendered — safe to remove loading');
      removeLoadingScreen();
    });

    // DO NOT detect flutter-view — that fires before widgets render!
    // Instead, use a longer timeout with error UI

    // After 20 seconds, if still loading, show error + reload button
    setTimeout(function() {
      if (!loadingRemoved) {
        console.warn('[VenusOne] App did not render within 20s');
        var loading = document.getElementById('loading');
        if (loading) {
          // Change loading text to error state
          loading.innerHTML = '<span>✨ Venus One</span>' +
            '<span style="font-size:13px;color:#ff6b6b;margin-top:12px;">Uygulama yüklenemedi.</span>' +
            '<button onclick="window.location.reload()" style="margin-top:16px;padding:10px 24px;background:#FFD700;color:#0D0D1A;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;">Sayfayı Yenile</button>' +
            '<span style="font-size:11px;color:#666;margin-top:8px;">Sorun devam ederse tarayıcı önbelleğini temizleyin.</span>';
        }
      }
    }, 20000);

    // Catch JS-level errors for debugging
    window.addEventListener('error', function(e) {
      console.error('[VenusOne] JS Error:', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[VenusOne] Unhandled Promise:', e.reason);
    });

    // ═══════════════════════════════════════════════════════════════
    // PWA INSTALL PROMPT — capture beforeinstallprompt and stash it.
    // The Flutter app can trigger it via window.__venusInstallPWA().
    // ═══════════════════════════════════════════════════════════════
    window.__venusDeferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__venusDeferredInstallPrompt = e;
      console.log('[VenusOne] PWA install prompt available');
      // Show a small floating install banner after 30s if user hasn't dismissed
      setTimeout(showPwaInstallBanner, 30000);
    });

    window.addEventListener('appinstalled', function() {
      console.log('[VenusOne] PWA installed');
      window.__venusDeferredInstallPrompt = null;
      var banner = document.getElementById('pwa-banner');
      if (banner) banner.remove();
    });

    window.__venusInstallPWA = function() {
      var prompt = window.__venusDeferredInstallPrompt;
      if (!prompt) return Promise.resolve('unavailable');
      prompt.prompt();
      return prompt.userChoice.then(function(result) {
        window.__venusDeferredInstallPrompt = null;
        return result.outcome;
      });
    };

    function showPwaInstallBanner() {
      if (!window.__venusDeferredInstallPrompt) return;
      if (localStorage.getItem('venus_pwa_dismissed') === '1') return;
      if (document.getElementById('pwa-banner')) return;
      var banner = document.createElement('div');
      banner.id = 'pwa-banner';
      banner.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:14px 20px;border-radius:14px;border:1px solid rgba(255,215,0,0.3);box-shadow:0 8px 32px rgba(0,0,0,0.5);z-index:99999;display:flex;align-items:center;gap:12px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;max-width:90%;';
      banner.innerHTML = '<span style="font-size:20px;">✨</span>' +
        '<span style="flex:1;">Venus One\'ı ana ekranınıza ekleyin</span>' +
        '<button onclick="window.__venusInstallPWA().then(()=>{var b=document.getElementById(\'pwa-banner\');if(b)b.remove();})" style="background:#FFD700;color:#0D0D1A;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;">Yükle</button>' +
        '<button onclick="localStorage.setItem(\'venus_pwa_dismissed\',\'1\');document.getElementById(\'pwa-banner\').remove();" style="background:transparent;color:#888;border:none;cursor:pointer;font-size:18px;padding:0 4px;">×</button>';
      document.body.appendChild(banner);
    }

    console.log('[VenusOne] Loading script initialized');
  </script>

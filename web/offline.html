<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Çevrimdışı — Venus One</title>
  <meta name="theme-color" content="#0D0D1A">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #1F1B3A 0%, #0D0D1A 60%, #000000 100%);
      color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
    }
    .container { max-width: 460px; padding: 48px 32px; text-align: center; }
    .logo {
      width: 96px; height: 96px; margin: 0 auto 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      box-shadow: 0 12px 48px rgba(102, 126, 234, 0.4);
    }
    h1 { font-size: 32px; font-weight: 300; letter-spacing: 4px; margin: 0 0 12px 0; }
    .subtitle { font-size: 14px; color: rgba(255, 255, 255, 0.6); margin: 0 0 32px 0; }
    .icon { font-size: 64px; margin: 0 0 16px 0; opacity: 0.7; }
    .message { font-size: 16px; line-height: 1.6; color: rgba(255, 255, 255, 0.85); margin: 0 0 32px 0; }
    button {
      background: #667EEA; color: white; border: none;
      padding: 16px 40px; border-radius: 30px;
      font-size: 16px; font-weight: 600; letter-spacing: 1px;
      cursor: pointer; transition: all 0.2s;
    }
    button:hover { background: #7C8FF0; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4); }
    .hint { margin-top: 24px; font-size: 12px; color: rgba(255, 255, 255, 0.4); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">✨</div>
    <h1>Venus One</h1>
    <p class="subtitle">Kişisel Kozmik Rehberiniz</p>
    <div class="icon">🌙</div>
    <p class="message">İnternet bağlantısı bulunamadı.<br>Yıldızlar bulutların arkasında — birazdan tekrar deneyin.</p>
    <button onclick="window.location.reload()">Tekrar Dene</button>
    <p class="hint">No internet connection · Reconnect to continue</p>
  </div>
  <script>
    window.addEventListener('online', function() { window.location.reload(); });
  </script>
</body>
</html>
